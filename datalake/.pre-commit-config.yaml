repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4  
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, ansi]
        files: ^datalake/(analytics/models|src)/
      - id: sqlfluff-fix
        args: [--dialect, ansi]
        files: ^datalake/(analytics/models|src)/